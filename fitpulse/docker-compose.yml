version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fitpulse-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fitpulse_user
      MONGO_INITDB_ROOT_PASSWORD: fitpulse_password
      MONGO_INITDB_DATABASE: fitpulse
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
