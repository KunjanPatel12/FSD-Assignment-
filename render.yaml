services:
  - type: web
    name: fitpulse-server
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
